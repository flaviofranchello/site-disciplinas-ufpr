<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Aulas e materiais complementares da disciplina Física III — UFPR, 2026.2." />
    <meta name="theme-color" content="#1f5b78" />
    <title>Física III • Aulas e materiais</title>
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="theme-fisica-3">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header">
      <div class="shell">
        <a class="brand" href="../" aria-label="Página inicial das disciplinas">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="2" fill="currentColor"/><ellipse cx="12" cy="12" rx="9" ry="3.5"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(120 12 12)"/></svg>
          </span>
          <span class="brand-copy">Disciplinas de Física<small>UFPR • 2026.2</small></span>
        </a>
        <button class="menu-button" type="button" aria-label="Abrir menu" aria-expanded="false" data-menu-button>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav class="site-nav" aria-label="Navegação principal" data-site-nav>
          <a href="../">Início</a>
          <a href="./" aria-current="page">Física III</a>
          <a href="../fisica-experimental-1/">Física Experimental I</a>
        </nav>
      </div>
    </header>

    <main id="conteudo">
      <section class="course-heading shell">
        <p class="eyebrow">2026.2</p>
        <h1>Física III</h1>
        <p class="course-description">Aulas e listas da disciplina.</p>
      </section>

      <section class="materials-section compact-materials" data-materials-catalog data-manifest="materiais.json" data-default-filter="aulas">
        <div class="shell">
          <div class="section-heading file-heading">
            <div>
              <h2>Arquivos</h2>
            </div>
            <p>Selecione uma categoria ou busque pelo título.</p>
          </div>

          <div class="material-tools">
            <label class="search-box">
              <span class="skip-link">Buscar materiais</span>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
              <input type="search" placeholder="Buscar por título…" data-materials-search />
            </label>
            <div class="filters" aria-label="Filtrar materiais">
              <button class="filter-button" type="button" data-filter="aulas">Aulas</button>
              <button class="filter-button" type="button" data-filter="listas">Listas</button>
            </div>
          </div>
          <p class="materials-status" aria-live="polite" data-materials-status>Carregando materiais…</p>
          <div class="materials-grid" data-materials-grid></div>
          <noscript><p>Ative o JavaScript para visualizar o catálogo de materiais.</p></noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell"><span class="footer-brand">Física III</span><p>Materiais didáticos • UFPR • <span data-current-year>2026</span></p></div>
    </footer>
    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/materiais.js"></script>
  </body>
</html>
